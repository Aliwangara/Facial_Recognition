       <style>
          .video-container {
    max-width: 640px;
    margin: 0 auto;
    text-align: center;
}

.status-container {
    position: relative;
    margin: 20px 0;
}

.recognition-feedback {
    position: absolute;
    bottom: 10px;
    left: 0;
    right: 0;
    background: rgba(0, 0, 0, 0.7);
    color: white;
    padding: 10px;
}

#currentStatus {
    font-weight: bold;
    margin-bottom: 5px;
}

#attendanceStats {
    font-size: 0.9em;
}

.face-recognized {
    position: absolute;
    right: 10px;
    top: -40px;
    background: rgba(76, 175, 80, 0.9);
    color: white;
    padding: 5px 10px;
    border-radius: 20px;
    animation: slideIn 0.3s ease-out;
    transition: opacity 0.5s;
}

@keyframes slideIn {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}
       </style>
